[pytest]
# This repo names tests `<thing>_test.py`, not `test_<thing>.py`, so default discovery
# found zero of them. `pytest` at the root used to exit 5 (no tests collected) -- which
# is indistinguishable at a glance from a suite that ran and passed.
python_files = *_test.py
python_functions = test_*

# Scoped deliberately, not for tidiness:
#   trade_analysis/live_lab/  every test here runs offline on any OS with
#                             requirements-dev.txt. This is the CI set.
#   huggingface_space/        EXCLUDED: its tests fetch live quotes through yfinance, so
#                             they are integration checks against a third party, not
#                             unit tests. Run them by hand; a network flake must never
#                             read as a code failure.
#   trade_analysis/backtesting/  EXCLUDED: `*_backtest.py` files are research scripts
#                             that need the local ThetaData archive. They are not tests
#                             and were never meant to be collected.
testpaths = trade_analysis/live_lab

addopts = -q --strict-markers
